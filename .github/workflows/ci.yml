name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint and test
        run: |
          docker build --target dev -t rss-reader-try:dev .
          docker run --rm rss-reader-try:dev

      - name: Audit dependencies
        run: docker run --rm rss-reader-try:dev uv audit --locked --preview-features audit-command

      - name: Smoke test the image
        shell: bash
        run: |
          docker build -t rss-reader-try .
          run() {
            docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
              --user "$(id -u):$(id -g)" -v "$PWD:/data" rss-reader-try "$@"
          }
          run examples/sample-feed.xml | tee /dev/stderr | grep -q '^fetched: 3 articles from "Sample Feed" -> html/Sample-Feed.html$'
          run examples/sample-feed.xml | tee /dev/stderr | grep -q '^cache: 3 articles'
          grep -q 'はじめての RSS リーダ' html/Sample-Feed.html
          if run missing.xml; then exit 1; fi

      - name: End-to-end test
        run: scripts/e2e.sh
